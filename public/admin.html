<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear código de acceso — Sinergia Educativa</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #14151a;
    color: #eee;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #1e1f26;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 28px 24px;
  }
  h1 {
    font-size: 1.3rem;
    color: #e0a33e;
    margin: 0 0 4px;
  }
  p.sub { color: #999; margin: 0 0 24px; font-size: 0.9rem; }
  label {
    display: block;
    font-size: 0.85rem;
    color: #bbb;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    background: #101116;
    border: 1px solid #3a3b44;
    color: #fff;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    margin-top: 22px;
    width: 100%;
    background: #d9691b;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  #result {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #result.ok { background: #16311f; color: #7fd99a; display: block; }
  #result.err { background: #3a1616; color: #ff9c9c; display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Crear código de acceso</h1>
  <p class="sub">Sinergia Educativa — Armado de CV Docente</p>

  <label for="secret">Clave de administrador (ADMIN_SECRET)</label>
  <input type="password" id="secret" placeholder="Tu clave" autocomplete="off">

  <label for="code">Código a crear</label>
  <input type="text" id="code" placeholder="Ej: DOCENTE2026" autocomplete="off">

  <label for="label">Etiqueta / nombre (opcional)</label>
  <input type="text" id="label" placeholder="Ej: Código de prueba" autocomplete="off">

  <button id="btn">Crear código</button>

  <div id="result"></div>
</div>

<script>
const btn = document.getElementById('btn');
const result = document.getElementById('result');

btn.addEventListener('click', async () => {
  const secret = document.getElementById('secret').value.trim();
  const code = document.getElementById('code').value.trim();
  const label = document.getElementById('label').value.trim();

  result.style.display = 'none';

  if (!secret || !code) {
    result.className = 'err';
    result.textContent = 'Completá la clave y el código.';
    result.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creando...';

  try {
    const res = await fetch('/api/admin-add-code', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-secret': secret
      },
      body: JSON.stringify({ code, label })
    });

    const data = await res.json();

    if (res.ok && data.ok) {
      result.className = 'ok';
      result.textContent = '✔ Código creado con éxito: ' + data.code;
    } else {
      result.className = 'err';
      result.textContent = '✖ Error: ' + (data.error || 'algo salió mal (status ' + res.status + ')');
    }
  } catch (e) {
    result.className = 'err';
    result.textContent = '✖ No se pudo conectar: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Crear código';
  }
});
</script>
</body>
</html>

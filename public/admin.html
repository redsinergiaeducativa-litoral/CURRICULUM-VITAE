<title>Crear código de acceso — Sinergia Educativa</title>
<style>
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #14151a; color: #eee; display: flex; justify-content: center; padding: 24px 16px; }
  .card { max-width: 420px; width: 100%; background: #1e1f26; border: 1px solid #333; border-radius: 14px; padding: 28px 24px; }
  h1 { font-size: 1.3rem; color: #e0a33e; margin: 0 0 4px; }
  p.sub { color: #999; margin: 0 0 24px; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; color: #bbb; margin: 16px 0 6px; }
  input { width: 100%; box-sizing: border-box; background: #101116; border: 1px solid #3a3b44; color: #fff; padding: 12px 14px; border-radius: 8px; font-size: 1rem; }
  button { margin-top: 22px; width: 100%; background: #d9691b; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
